<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اسکن‌یار — اسکنر اسناد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5F5A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F6F2EA;
    --paper-card:#FFFFFF;
    --ink:#20241F;
    --ink-soft:#5B5F57;
    --teal:#2C5F5A;
    --teal-deep:#1B3E3B;
    --line:#E3DCCC;
    --danger:#B4462F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
  }
  .app{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    flex-shrink:0;
  }
  .topbar h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .topbar h1 span{color:var(--teal);}
  .topbar p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .empty-state{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--ink-soft);
    gap:14px;
    padding:0 30px;
  }
  .empty-state .ring{
    width:88px;height:88px;
    border-radius:50%;
    border:2px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .empty-state svg{width:36px;height:36px;stroke:var(--teal);}
  .empty-state h2{font-size:16px;font-weight:700;color:var(--ink);margin:0;}
  .empty-state p{font-size:13px;line-height:1.9;margin:0;}

  .pages-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  .page-card{
    position:relative;
    background:var(--paper-card);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(32,36,31,0.08), 0 4px 14px rgba(32,36,31,0.06);
    border:1px solid var(--line);
  }
  .page-card img{
    display:block;
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    background:#eee;
  }
  .page-badge{
    position:absolute;
    top:6px; right:6px;
    background:rgba(27,62,59,0.85);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
  }
  .page-actions{
    position:absolute;
    bottom:0; right:0; left:0;
    display:flex;
    justify-content:space-between;
    padding:6px;
    background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);
  }
  .page-actions button{
    width:26px;height:26px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.92);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .page-actions button svg{width:14px;height:14px;stroke:var(--ink);}
  .page-actions button.del svg{stroke:var(--danger);}

  .bottombar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:var(--paper-card);
    border-top:1px solid var(--line);
    gap:14px;
  }
  .count-pill{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    min-width:52px;
  }
  .capture-btn{
    width:62px;height:62px;
    border-radius:50%;
    background:var(--teal);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(44,95,90,0.35);
    border:3px solid var(--paper-card);
    outline:2px solid var(--teal);
    flex-shrink:0;
    transition:transform 0.15s ease;
  }
  .capture-btn:active{transform:scale(0.92);}
  .capture-btn svg{width:26px;height:26px;stroke:#fff;}

  .export-btn{
    background:none;
    border:1.5px solid var(--teal);
    color:var(--teal);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:9px 16px;
    border-radius:22px;
    cursor:pointer;
    white-space:nowrap;
  }
  .export-btn:disabled{
    border-color:var(--line);
    color:#B7B2A2;
    cursor:not-allowed;
  }
  .export-btn:not(:disabled):active{background:var(--teal);color:#fff;}

  /* Scan processing overlay — the signature moment */
  .scan-overlay{
    position:fixed; inset:0;
    background:rgba(20,24,19,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .scan-overlay.active{display:flex;}
  .scan-frame{
    position:relative;
    width:150px;height:200px;
    border-radius:8px;
    overflow:hidden;
    background:#111;
    box-shadow:0 0 0 1px rgba(255,255,255,0.15);
  }
  .scan-frame img{width:100%;height:100%;object-fit:cover;opacity:0.85;}
  .scan-line{
    position:absolute;
    right:0; left:0; height:3px;
    background:linear-gradient(90deg, transparent, #7FE0C6, transparent);
    box-shadow:0 0 12px 2px #7FE0C6;
    animation:sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{top:0%;}
    50%{top:97%;}
    100%{top:0%;}
  }
  .scan-caption{
    color:#F6F2EA;
    font-size:13px;
    font-weight:600;
    margin-top:18px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .scan-line{animation:none; top:50%;}
    .capture-btn{transition:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>اسکن<span>‌یار</span></h1>
    <p>اسناد رو عکس بگیر، صاف و واضحش کن، خروجی PDF بگیر</p>
  </div>

  <main>
    <div class="empty-state" id="emptyState">
      <div class="ring">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
      </div>
      <h2>هنوز سندی اسکن نشده</h2>
      <p>دکمه‌ی گرد پایین صفحه رو بزن<br>و اولین صفحه رو اسکن کن</p>
    </div>
    <div class="pages-grid" id="pagesGrid" style="display:none;"></div>
  </main>

  <div class="bottombar">
    <span class="count-pill" id="pageCount">۰ صفحه</span>
    <label class="capture-btn" for="cameraInput">
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h2l1.5-2h9L18 8h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
        <circle cx="12" cy="13" r="3.2"/>
      </svg>
    </label>
    <button class="export-btn" id="exportBtn" disabled>خروجی PDF</button>
  </div>
</div>

<div class="scan-overlay" id="scanOverlay">
  <div>
    <div class="scan-frame">
      <img id="scanPreview" src="" alt="">
      <div class="scan-line"></div>
    </div>
    <p class="scan-caption">در حال صاف و واضح کردن سند...</p>
  </div>
</div>

<script>
(function(){
  const pages = []; // {id, dataUrl}
  const cameraInput = document.getElementById('cameraInput');
  const pagesGrid = document.getElementById('pagesGrid');
  const emptyState = document.getElementById('emptyState');
  const pageCountEl = document.getElementById('pageCount');
  const exportBtn = document.getElementById('exportBtn');
  const scanOverlay = document.getElementById('scanOverlay');
  const scanPreview = document.getElementById('scanPreview');

  const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function toFa(n){ return String(n).split('').map(d => faDigits[+d] ?? d).join(''); }

  function render(){
    if(pages.length === 0){
      emptyState.style.display = 'flex';
      pagesGrid.style.display = 'none';
      exportBtn.disabled = true;
      pageCountEl.textContent = '۰ صفحه';
      return;
    }
    emptyState.style.display = 'none';
    pagesGrid.style.display = 'grid';
    exportBtn.disabled = false;
    pageCountEl.textContent = toFa(pages.length) + ' صفحه';

    pagesGrid.innerHTML = pages.map((p, i) => `
      <div class="page-card">
        <img src="${p.dataUrl}" alt="صفحه ${toFa(i+1)}">
        <div class="page-badge">${toFa(i+1)}</div>
        <div class="page-actions">
          <button class="move" data-action="left" data-id="${p.id}" title="جابه‌جایی">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="move" data-action="right" data-id="${p.id}" title="جابه‌جایی">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="del" data-action="del" data-id="${p.id}" title="حذف">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    `).join('');
  }

  pagesGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const id = btn.dataset.id;
    const idx = pages.findIndex(p => p.id === id);
    if(idx === -1) return;
    const action = btn.dataset.action;
    if(action === 'del'){
      pages.splice(idx, 1);
    } else if(action === 'left' && idx > 0){
      // RTL layout: "left" arrow (points left) moves item toward the end visually leftwards
      [pages[idx-1], pages[idx]] = [pages[idx], pages[idx-1]];
    } else if(action === 'right' && idx < pages.length - 1){
      [pages[idx+1], pages[idx]] = [pages[idx], pages[idx+1]];
    }
    render();
  });

  function enhanceImage(img){
    // Downscale to a sane max width, boost contrast/brightness to look "scanned"
    const maxW = 1600;
    const scale = Math.min(1, maxW / img.width);
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const imageData = ctx.getImageData(0, 0, w, h);
    const d = imageData.data;
    const contrast = 1.28;
    const brightness = 18;
    const intercept = 128 * (1 - contrast);
    for(let i = 0; i < d.length; i += 4){
      // slight desaturation toward document look, then contrast/brightness
      const gray = 0.34*d[i] + 0.5*d[i+1] + 0.16*d[i+2];
      for(let c = 0; c < 3; c++){
        const orig = d[i+c];
        const mixed = orig * 0.72 + gray * 0.28;
        let v = mixed * contrast + intercept + brightness;
        d[i+c] = Math.max(0, Math.min(255, v));
      }
    }
    ctx.putImageData(imageData, 0, 0);
    return { dataUrl: canvas.toDataURL('image/jpeg', 0.9), width: w, height: h };
  }

  cameraInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        scanPreview.src = ev.target.result;
        scanOverlay.classList.add('active');
        // let the sweep animation play briefly so processing feels tangible
        setTimeout(() => {
          const enhanced = enhanceImage(img);
          pages.push({
            id: 'p' + Date.now() + Math.random().toString(36).slice(2,7),
            dataUrl: enhanced.dataUrl,
            width: enhanced.width,
            height: enhanced.height
          });
          scanOverlay.classList.remove('active');
          render();
        }, 850);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    cameraInput.value = '';
  });

  exportBtn.addEventListener('click', () => {
    if(pages.length === 0) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = 210, pageH = 297;
    const margin = 8;

    pages.forEach((p, i) => {
      if(i > 0) doc.addPage();
      const availW = pageW - margin*2;
      const availH = pageH - margin*2;
      const ratio = Math.min(availW / p.width, availH / p.height);
      const w = p.width * ratio;
      const h = p.height * ratio;
      const x = (pageW - w) / 2;
      const y = (pageH - h) / 2;
      doc.addImage(p.dataUrl, 'JPEG', x, y, w, h);
    });

    doc.save('scan-yar-' + Date.now() + '.pdf');
  });

  render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
